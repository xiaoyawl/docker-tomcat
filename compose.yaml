services:
  tomcat:
    image: benyoo/tomcat:11.0-jdk17-alpine3.24
    container_name: dstw-tomcat
    restart: always
    ports:
      - "8080:8080"
    environment:
      TIMEZONE: Asia/Shanghai
      CATALINA_OPTS: "-Dfile.encoding=UTF-8"
    volumes:
      - ./webapps:/webapps
      - ./logs:/logs
    logging:
      driver: json-file
      options:
        max-size: "300m"
        max-file: "5"
